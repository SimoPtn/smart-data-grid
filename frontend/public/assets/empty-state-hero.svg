  <path d="M450 100C480 100 505 125 505 155V185H485V155C485 140 475 130 460 130C445 130 435 140 435 155V200H415V155C415 125 440 100 450 100Z" fill="#D5DDE7"></path>
  <path d="M450 105C470 105 490 125 490 155V175H478V155C478 140 468 132 458 132C448 132 438 140 438 155V190H426V155C426 125 446 105 450 105Z" fill="#AAB8C8"></path>

