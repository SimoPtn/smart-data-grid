  <rect x="720" y="90" width="12" height="12" rx="2" stroke="#D3DBE5" stroke-width="3"></rect>
  <rect x="300" y="350" width="12" height="12" rx="2" stroke="#D3DBE5" stroke-width="3"></rect>
