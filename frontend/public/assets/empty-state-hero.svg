  <circle cx="520" cy="250" r="24" fill="#D1DAE6" stroke="#AAB7C6" stroke-width="3"></circle>

  <path d="M420 300C450 260 540 260 570 300" stroke="#AAB7C6" stroke-width="8" stroke-linecap="round"></path>

