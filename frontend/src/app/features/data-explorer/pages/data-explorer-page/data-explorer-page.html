@if (vm$ | async; as vm) {
  <section class="data-explorer-page">
    <h2>Data Explorer</h2>

    @if (vm.loading) {
      <p>Loading data...</p>
    } @else {
      <app-data-explorer-toolbar
        (searchChanged)="onSearchValueChanged($event)"
        (pageSizeChanged)="onPageSizeValueChanged($event)"
      />

      @if (vm.filteredRecords.length > 0) {
  <app-data-explorer-table
    [records]="vm.paginatedRecords"
    [displayedColumns]="vm.displayedColumns"
    [sortState]="vm.sortState"
    (sortChanged)="setSort($event)"
  />

  <app-data-explorer-pagination
    [pageIndex]="vm.pageIndex"
    [totalPages]="vm.totalPages"
    [canGoPrev]="vm.canGoPrev"
    [canGoNext]="vm.canGoNext"
    (prev)="prevPage()"
    (next)="nextPage()"
  />
} @else {
<div class="empty-state">
  <img src="/assets/empty-state-hero.svg" alt="No results" />

  <div class="empty-state-content">
    <h3>No results found</h3>
    <p>Try changing your search term.</p>
  </div>
</div>
}
    }
  </section>
}
