<table mat-table [dataSource]="records" class="data-table">

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef (click)="onSort('name')" class="sortable"
      [class.active-sort]="isActiveSort('name')">
      <div class="sort-header-content">
        <span>Name</span>
        <mat-icon>{{ getSortIcon('name') }}</mat-icon>
      </div>
    </th>
    <td mat-cell *matCellDef="let record">{{ record.name }}</td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef (click)="onSort('email')" class="sortable"
      [class.active-sort]="isActiveSort('email')">
      <div class="sort-header-content">
        <span>Email</span>
        <mat-icon>{{ getSortIcon('email') }}</mat-icon>
      </div>
    </th>
    <td mat-cell *matCellDef="let record">{{ record.email }}</td>
  </ng-container>

  <ng-container matColumnDef="company">
    <th mat-header-cell *matHeaderCellDef>Company</th>
    <td mat-cell *matCellDef="let record">{{ record.company }}</td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let record">
      <app-status-badge [status]="record.status" />
    </td>
  </ng-container>

  <ng-container matColumnDef="score">
    <th mat-header-cell *matHeaderCellDef (click)="onSort('score')" class="sortable"
      [class.active-sort]="isActiveSort('score')">
      <div class="sort-header-content">
        <span>Score</span>
        <mat-icon>{{ getSortIcon('score') }}</mat-icon>
      </div>
    </th>
    <td mat-cell *matCellDef="let record">{{ record.score }}</td>
  </ng-container>

  <ng-container matColumnDef="country">
  <th mat-header-cell *matHeaderCellDef>Country</th>
  <td mat-cell *matCellDef="let record">{{ record.country }}</td>
</ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef class="actions-header">Actions</th>
    <td mat-cell *matCellDef="let record" class="actions-cell">
      <div class="actions-cell-content">
        <button mat-icon-button type="button" aria-label="View record details" (click)="onView(record)">
          <mat-icon>visibility</mat-icon>
        </button>

        <button mat-icon-button type="button" aria-label="Edit record" (click)="onEdit(record)">
          <mat-icon>edit</mat-icon>
        </button>

        <button mat-icon-button type="button" aria-label="Delete record" (click)="onDelete(record)">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
